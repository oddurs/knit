# knit work-item registry — the single source of truth for the plan.
# Edit by hand; validate with `python3 roadmaps/tools/roadmap.py check`;
# regenerate STATUS.md with `... render`. Schema is documented in ../README.md.

schema_version = 1
project = "knit"

# ─────────────────────────────── milestones ───────────────────────────────

[[milestone]]
id = "m1"
version = "v0.1"
name = "the fabric"
status = "in-progress"
goal = "Two machines, one cable or LAN: run / each / ls working end to end, fast and seamless."

[[milestone]]
id = "m2"
version = "v0.2"
name = "trustworthy under real use"
status = "done"
goal = "Signals, explicit peers, working-dir sync, and a real install path."

[[milestone]]
id = "m3"
version = "v0.3"
name = "AI-native scheduling"
status = "planned"
goal = "Free-memory and accelerator reporting, memory-aware placement, MLX/torchrun sugar, link awareness."

[[milestone]]
id = "m4"
version = "v0.4"
name = "encrypted, persistent, shareable"
status = "planned"
goal = "TLS with pinned certs, reboot-persistent agents, and network sharing via SOCKS."

[[milestone]]
id = "backlog"
version = "—"
name = "backlog"
status = "backlog"
goal = "Measured future wins deferred by choice, kept coded so they are never lost."

