# goreleaser configuration for knit (https://goreleaser.com).
# Cut a release by pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
# CI (.github/workflows/release.yml) runs `goreleaser release --clean`.
version: 2

project_name: knit

before:
  hooks:
    - go mod tidy

builds:
  - id: knit
    main: ./cmd/knit
    binary: knit
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: knit
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

source:
  enabled: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publishes a formula to the oddurs/homebrew-tap repository so users can
# `brew install oddurs/tap/knit`. Requires a repo-scoped PAT in the release
# environment as HOMEBREW_TAP_GITHUB_TOKEN (a default GITHUB_TOKEN cannot push
# to a second repository). Until that secret and the tap repo exist, set
# skip_upload to keep releases green while still generating the formula artifact.
brews:
  - name: knit
    repository:
      owner: oddurs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/oddurs/knit"
    description: "Weave your machines into one fabric. Zero-config compute sharing."
    license: "MIT"
    skip_upload: "{{ .Env.SKIP_BREW }}"
    install: |
      bin.install "knit"
    test: |
      system "#{bin}/knit", "--version"
