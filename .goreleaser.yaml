# goreleaser configuration for knit (https://goreleaser.com).
# Cut a release by pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
# CI (.github/workflows/release.yml) runs `goreleaser release --clean`.
version: 2

project_name: knit

before:
  hooks:
    - go mod tidy

builds:
  - id: knit
    main: ./cmd/knit
    binary: knit
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: knit
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

source:
  enabled: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publishes a cask to oddurs/homebrew-tap so `brew install oddurs/tap/knit`
# works. The push goes over SSH with a deploy key scoped to the tap repository
# (secret HOMEBREW_TAP_DEPLOY_KEY on this repo); no personal token is involved.
homebrew_casks:
  - name: knit
    repository:
      owner: oddurs
      name: homebrew-tap
      git:
        url: "git@github.com:oddurs/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    commit_author:
      name: knit release
      email: releases@knit.invalid
    homepage: "https://github.com/oddurs/knit"
    description: "Weave your machines into one fabric. Zero-config compute sharing."
    license: "MIT"
    skip_upload: auto
    binaries:
      - knit
    hooks:
      post:
        # The binary is not notarized; strip the quarantine bit so it runs.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/knit"]
          end
